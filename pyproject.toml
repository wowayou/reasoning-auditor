[build-system]
requires = ["hatchling", "editables>=0.5"]
build-backend = "hatchling.build"

[project]
name = "reasoning-auditor"
version = "0.1.0"
description = "Turn AI-generated viewpoints into auditable claim graphs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
auditor = "auditor.cli:main"
auditor-web = "auditor.web.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["auditor"]
